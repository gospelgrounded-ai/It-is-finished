name: Parakletos

options:
  bundleIdPrefix: com.parakletos
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"        # iPhone only
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

targets:

  Parakletos:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Parakletos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gospelgrounded.parakletos
        # ── Developer Team ──────────────────────────────────────────────────
        # Fill in your 10-character Apple Developer Team ID after joining the
        # Apple Developer Program (developer.apple.com).
        # Example: DEVELOPMENT_TEAM: AB12CD34EF
        DEVELOPMENT_TEAM: ""
        # ────────────────────────────────────────────────────────────────────
        INFOPLIST_FILE: Parakletos/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: Parakletos/Supporting/Parakletos.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      # Delegate Info.plist management to our hand-written file above.
      # (Setting this prevents XcodeGen from auto-generating one.)
      path: Parakletos/Supporting/Info.plist

  ParakletosTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ParakletosTests
    dependencies:
      - target: Parakletos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gospelgrounded.parakletos.tests
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

schemes:
  Parakletos:
    build:
      targets:
        Parakletos: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: ParakletosTests
          parallelizable: true
    profile:
      config: Release
    archive:
      config: Release
